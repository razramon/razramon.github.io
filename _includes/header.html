<header class="site-header" role="banner">
  <div class="wrapper">
    <span class="site-title">{{ site.title | escape }}</span>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark mode" title="Light / dark"
            onclick="(function(){var d=document.documentElement,t=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',t);try{localStorage.setItem('theme',t)}catch(e){}})()">
      <span class="icon-dark" aria-hidden="true">&#9790;</span><span class="icon-light" aria-hidden="true">&#9728;</span>
    </button>
    <nav class="site-links">
      <a href="https://github.com/{{ site.github_username }}" aria-label="GitHub" title="GitHub"><svg class="link-icon" width="20" height="20" fill="currentColor" aria-hidden="true"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg></a>
      <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" aria-label="LinkedIn" title="LinkedIn"><svg class="link-icon" width="20" height="20" fill="currentColor" aria-hidden="true"><use xlink:href="{{ '/assets/minima-social-icons.svg#linkedin' | relative_url }}"></use></svg></a>
    </nav>
  </div>
</header>
